[project]
name = "arcpy"
version = "0.1.0"
description = "Archive operations"
authors = [
    {name = "Paul Hutchings", email = "dev@studiop.page"},
]
dependencies = [
    "unrar @ git+https://github.com/matiasb/python-unrar.git@ceaf02fb6251270d69a5768daefbf3795653f64a",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.dev-dependencies]
dev = [
    "black>=24.4.2",
    "pylint>=3.2.2",
    "isort>=5.13.2",
]
test = [
    "coverage>=7.5.3",
    "pytest-cov>=5.0.0",
    "pytest>=8.2.1",
]

[tool.pdm.scripts]
test = "coverage run -m pytest"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["__test__"]
addopts = ["--cov=arcpy", "--cov-report=html", "--import-mode=importlib"]

[tool.coverage.run]
branch = true
# source = ["arcpy"]

[tool.coverage.report]
show_missing = true

[tool.coverage.json]
pretty_print = true